name: Apply PDF service source fixes

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/fix-pdf-service-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply targeted TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend-nestjs/src/pdfs/pdfs.service.ts')
          text = path.read_text()
          text = text.replace("value = value.split(',');", "value = String(value).split(',');")
          old = "    if (form.getFields().length > 0) {\n      form.flatten();\n    }"
          new = "    if (form.getFields().length > 0) {\n      try {\n        form.flatten();\n      } catch {\n        // Imported overlays remain usable when a source form cannot be flattened.\n      }\n    }"
          if old not in text:
              raise SystemExit('flatten block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit source fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend-nestjs/src/pdfs/pdfs.service.ts
          git commit -m "fix(pdfs): harden imported form handling"
          git push origin development
