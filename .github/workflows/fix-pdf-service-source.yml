name: Apply PDF service source fixes

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/fix-pdf-service-source.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Apply targeted TypeScript fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend-nestjs/src/pdfs/pdfs.service.ts')
          text = path.read_text()
          old = """  private stringArray(value: unknown) {
              if (typeof value === 'string') {
                try {
                  const parsed = JSON.parse(value);
                  if (Array.isArray(parsed)) value = parsed;
                  else value = value.split(',');
                } catch {
                  value = value.split(',');
                }
              }
          """
          new = """  private stringArray(value: unknown) {
              const stringValue = typeof value === 'string' ? value : null;
              if (stringValue !== null) {
                try {
                  const parsed = JSON.parse(stringValue);
                  if (Array.isArray(parsed)) value = parsed;
                  else value = stringValue.split(',');
                } catch {
                  value = stringValue.split(',');
                }
              }
          """
          if old not in text:
              raise SystemExit('stringArray block not found')
          text = text.replace(old, new, 1)
          old_flatten = """    if (form.getFields().length > 0) {
              form.flatten();
            }
          """
          new_flatten = """    if (form.getFields().length > 0) {
              try {
                form.flatten();
              } catch {
                // Some third-party forms have incomplete appearance streams.
                // The imported pdfme overlays remain usable without flattening.
              }
            }
          """
          if old_flatten not in text:
              raise SystemExit('flatten block not found')
          path.write_text(text.replace(old_flatten, new_flatten, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-pdf-service-source.yml
      - name: Commit source fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend-nestjs/src/pdfs/pdfs.service.ts .github/workflows/fix-pdf-service-source.yml
          git commit -m "fix(pdfs): harden imported form handling"
          git push origin development
