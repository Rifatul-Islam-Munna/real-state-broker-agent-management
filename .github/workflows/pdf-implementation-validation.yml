name: PDF implementation validation

on:
  push:
    branches: [development]
    paths:
      - backend-nestjs/src/pdfs/**
      - backend-nestjs/src/app.module.ts
      - backend-nestjs/package.json
      - frontend/app/dashboard/pdfs/**
      - frontend/components/stitch/pages/pdf-management/**
      - frontend/hooks/use-pdfs-api.ts
      - frontend/lib/pdf/**
      - frontend/@types/pdf-management.ts
      - frontend/app/api/proxy/**
      - frontend/package.json
      - .github/workflows/pdf-implementation-validation.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: pdf-implementation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm test -- --runInBand --passWithNoTests
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  publish-status:
    if: always()
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Publish validation status
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          state=success
          description="PDF backend and frontend validation passed"
          if [ "$BACKEND_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ]; then
            state=failure
            description="PDF backend or frontend validation failed"
          fi
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SHA" \
            --data "{\"state\":\"$state\",\"target_url\":\"$RUN_URL\",\"description\":\"$description\",\"context\":\"pdf-implementation-validation\"}"
