name: Fix lead template fingerprint

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/fix-lead-template-fingerprint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Rebuild fingerprints from mapped sample
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend-nestjs/src/mail/lead-collection-template.service.ts')
          text = path.read_text()
          marker = '    const bodyFingerprint = this.stringArray(dto.bodyFingerprint).length'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('fingerprint block not found')
          end = text.find(';', start)
          if end < 0:
              raise SystemExit('fingerprint block end not found')
          replacement = '    const bodyFingerprint = buildLeadCollectionFingerprint(sourceText, mappings);'
          path.write_text(text[:start] + replacement + text[end + 1:])
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-lead-template-fingerprint.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend-nestjs/src/mail/lead-collection-template.service.ts .github/workflows/fix-lead-template-fingerprint.yml
          git commit -m "fix(leads): exclude dynamic values from template fingerprints"
          git push origin development
