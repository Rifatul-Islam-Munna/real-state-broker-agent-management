name: Fix lead template anchors

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/fix-lead-template-anchors.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
      - name: Add nearest line anchor candidates
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend-nestjs/src/mail/lead-collection-parser.ts')
          text = path.read_text()
          start = text.find("function anchorCandidates(anchor: string, direction: 'head' | 'tail') {")
          end = text.find('function senderPatternScore', start)
          if start < 0 or end < 0:
              raise SystemExit('anchorCandidates block not found')
          replacement = """function anchorCandidates(anchor: string, direction: 'head' | 'tail') {
            const normalized = normalizeLeadCollectionText(anchor);
            if (!normalized) return [];
            const sizes = [normalized.length, 120, 80, 50, 28]
              .filter((size) => size > 0 && size <= normalized.length);
            const lines = normalized.split('\\n').map((line) => line.trim()).filter(Boolean);
            const nearestLine = direction === 'tail' ? lines[lines.length - 1] : lines[0];
            return [...new Set([
              ...sizes.map((size) =>
                direction === 'tail' ? normalized.slice(-size) : normalized.slice(0, size),
              ),
              nearestLine,
            ])].filter((value) => value && value.length >= 3);
          }

          """
          path.write_text(text[:start] + replacement + text[end:])
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-lead-template-anchors.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend-nestjs/src/mail/lead-collection-parser.ts .github/workflows/fix-lead-template-anchors.yml
          git commit -m "fix(leads): anchor fields to nearest stable label line"
          git push origin development
