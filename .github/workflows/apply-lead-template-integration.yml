name: Apply lead template integration

on:
  push:
    branches: [development]
    paths:
      - .github/workflows/apply-lead-template-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0
      - name: Apply mailbox integration
        run: python backend-nestjs/scripts/apply-lead-template-integration.py
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend-nestjs/src/mail/mail-sync.service.ts
          git commit -m "feat(leads): use templates before AI during mailbox sync"
          git pull --rebase origin development
          git push origin development
